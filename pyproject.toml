[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "greaseweazle-gui"
version = "0.2.1"
description = "A native GNOME interface for Greaseweazle disk operations"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = []

[project.gui-scripts]
greaseweazle-gui = "greaseweazle_gui.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
greaseweazle_gui = ["help_images/*.png"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "SIM", "C4", "PIE", "PERF"]
