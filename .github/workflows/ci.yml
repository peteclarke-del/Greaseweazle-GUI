name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests and source checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install metadata validators
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream desktop-file-utils

      - name: Install project
        run: python -m pip install --no-deps --editable . ruff==0.16.4

      - name: Check Python style
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Check launcher syntax
        run: bash -n greaseweazle-gui packaging/*.sh

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/com.github.pclarke.GreaseweazleGUI.desktop
          appstreamcli validate --no-net data/com.github.pclarke.GreaseweazleGUI.metainfo.xml

  interface:
    name: Interface tests on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7

      # The interface tests need PyGObject, GTK 4 and libadwaita, which come
      # from the distribution rather than pip, so this job uses each Ubuntu
      # release's own Python and the libadwaita the package is installed with.
      - name: Install GTK and the display server
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 \
            xvfb dbus-daemon

      - name: Run tests with the interface
        env:
          PYTHONPATH: src
          # Fail rather than skip the interface tests if GTK cannot be used.
          GREASEWEAZLE_GUI_REQUIRE_GTK: "1"
          GSK_RENDERER: cairo
        run: >-
          dbus-run-session -- xvfb-run --auto-servernum
          /usr/bin/python3 -m unittest discover -s tests -v

  package:
    name: Installer on ${{ matrix.distro }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu24.04
            runner: ubuntu-24.04
            python: "3.12"
          - distro: ubuntu26.04
            runner: ubuntu-26.04
            python: "3.14"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Build installer
        env:
          PACKAGE_DISTRO: ${{ matrix.distro }}
        run: ./packaging/build-deb.sh dist

      - name: Install, run and remove the package
        run: |
          dpkg-deb --field dist/*.deb Depends
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb
          test -x /usr/bin/greaseweazle-gui
          /usr/lib/greaseweazlegui/bin/gw info --help
          PYTHONPATH=/usr/lib/greaseweazlegui /usr/bin/python3 -c "import greaseweazle_gui, greaseweazle, bitarray"
          sudo apt-get remove -y greaseweazlegui
          test ! -e /usr/bin/greaseweazle-gui
